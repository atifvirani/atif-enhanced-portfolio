services:
  - type: web
    name: atif-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USER
        value: c0a6c9001@smtp-brevo.com
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: mohammedatif.dev@gmail.com
      - key: RECEIVER_EMAIL
        value: mohammedatif.dev@gmail.com
      - key: FRONTEND_ORIGIN
        value: "*"
